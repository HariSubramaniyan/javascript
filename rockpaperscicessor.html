<!DOCTYPE html>
<head><title>rock papper sicssors</title></head>
<body>
    <button onclick="Play('Rock')">Rock</button>
    <button onclick="Play('Paper')">Paper</button>
    <button onClick="Play('Scissors')">Sicssors</button>
    <script>
        function pickComputerMove(){

            const randomNumber = Math.random();
            let computerMove = '';

            if(randomNumber >=0 &&randomNumber < 1/3 ){
                computerMove = 'Rock';
            }
            else if (randomNumber  > 1 / 3 && randomNumber  < 2/ 3){
                computerMove = 'Papper';
            }
            else if(randomNumber > 2 / 3 && computerMove < 1){
                computerMove = 'Scissors';
            }
            return computerMove;
        }

        function Play(val){

            const computerMove = pickComputerMove();

            let res = '';

            if(val === 'Rock'){
                if(computerMove === 'Rock'){
                    res = 'Tie';
                }
                else if(computerMove === 'Papper'){
                    res = 'You Lose';
                }
                else if(computerMove ==='Scissors'){
                    res ='you Won';
                }
            }
            if(val === 'Paper'){
                if(computerMove === 'Rock'){
                    res = 'you Won';
                }
                else if(computerMove === 'Papper'){
                    res = 'Tie';
                }
                else if(computerMove ==='Scissors'){
                    res ='you Lose';
                }
            }
            if(val === 'Scissors'){
                if(computerMove === 'Rock'){
                    res = 'You Lose';
                }
                else if(computerMove === 'Papper'){
                    res = 'You Win';
                }
                else if(computerMove ==='Scissors'){
                    res ='Tie';
                }
            }
            alert(`your Move is ${val} and bot move is ${computerMove}
             ${res}`);

            

        }

    </script>

</body>
</html>
