<!DOCTYPE html>
<head>
    <title> Rock paper sicssors</title>
    <link rel="stylesheet" 
    href="./Styles/advanction-function.css">
</head>
<body>
    <p class="title">Rock Papper Scissors</p>
    <button onclick="Play('Rock')" class="move-button">
        <img src="./rock-papper-scisoorser-img/rock-emoji.png"  class="move-icon">
    </button>
    <button onclick="Play('paper')" class="move-button">
        <img src="./rock-papper-scisoorser-img/paper-emoji.png" class="move-icon">
    </button>
    <button onClick="Play('scissors')" class="move-button">
        <img src="./rock-papper-scisoorser-img/scissors-emoji.png" class="move-icon">
    </button>
    <p class="js-result result" ></p>
    <p class="js-moves">
    </p>
    <p class="js-score"></p>
    <button onclick="
    Scores.wins = 0;
    Scores.Losses = 0;
    Scores.Ties = 0;
    localStorage.removeItem('score');
    updateScoreEle();
    " class = "rest-play-button" >Reset</button>
    <button onclick="autoPlay()"  class = "auto-play-button">AutoPlay</button>
    <script src="./Scripts/Advance-function.js">
    </script>

</body>
</html>
