<!DOCTYPE html>
<head>
    <title> Rock paper sicssors</title>
</head>
<body>
    <button onclick="Play('Rock')">Rock</button>
    <button onclick="Play('Paper')">Paper</button>
    <button onClick="Play('Scissors')">Sicssors</button>
    <button onclick=" localStorage.removeItem('score')">reset</button>
    <script>
        function pickComputerMove(){

            const randomNumber = Math.random();
            let computerMove = '';

            if(randomNumber >=0 &&randomNumber < 1/3 ){
                computerMove = 'Rock';
            }
            else if (randomNumber  > 1 / 3 && randomNumber  < 2/ 3){
                computerMove = 'Papper';
            }
            else if(randomNumber > 2 / 3 && computerMove < 1){
                computerMove = 'Scissors';
            }
            return computerMove;
        }

        function Play(val){

            let Scores = JSON.parse(localStorage.getItem('score')) || {
                wins : 0,
                Ties : 0,
                Losses : 0
            }
            const computerMove = pickComputerMove();

            let res = '';

            if(val === 'Rock'){
                if(computerMove === 'Rock'){
                    res = 'Tie';
                }
                else if(computerMove === 'Papper'){
                    res = 'You Lose';
                }
                else if(computerMove ==='Scissors'){
                    res ='You Win';
                }
            }
            if(val === 'Paper'){
                if(computerMove === 'Rock'){
                    res = 'You Win';
                }
                else if(computerMove === 'Papper'){
                    res = 'Tie';
                }
                else if(computerMove ==='Scissors'){
                    res ='You Lose';
                }
            }
            if(val === 'Scissors'){
                if(computerMove === 'Rock'){
                    res = 'You Lose';
                }
                else if(computerMove === 'Papper'){
                    res = 'You Win';
                }
                else if(computerMove ==='Scissors'){
                    res ='Tie';
                }
            }

            if(res === 'You Win'){
                Scores.wins+=1;
            }
            else if(res ==='Tie'){
                Scores.Ties += 1;
            }
            else if(res ==='You Lose'){
                Scores.Losses+=1;
            }

            localStorage.setItem('score',JSON.stringify(Scores));

            alert(`You Picked ${val} and Computer Picked ${computerMove}. ${res}
Wins : ${Scores.wins} , Losses : ${Scores.Losses} , Ties: ${Scores.Ties}`);

            

        }

    </script>

</body>
</html>
