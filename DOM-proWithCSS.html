<!DOCTYPE html>
<head>
   <title> DOM Projects</title>
   <style>
    .subscribe-button{
        border: none;
        background-color: black;
        color: white;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-right: 15px;
        padding-left: 15px;
        font-weight: bold;
        border-radius: 50px;
        cursor: pointer;

    }
    .is-Subcribe{
        background-color: gainsboro;
        color: black;
    }
    p{
        
    }
   </style>
</head>
<body>
    <p>YouTube Subscribe button</p>
    <button onclick="subscribe()" class="js-subscribe-button subscribe-button">Subscribe</button>
    <p>Shipping calculator</p>
    <input placeholder="cost of order" class="js-cost-input" onkeydown="
        //console.log(event);
        handlecostKeyDown(event);
        

    ">
    <button onclick="CalculateTotal()">Calculate</button>
    <p class="js-total-cost"></p>
    
    <script>
        function subscribe(){
            const buttonEle =  document.querySelector('.js-subscribe-button');
                if(buttonEle.innerHTML === 'Subscribe'){
                    buttonEle.innerHTML = 'Subscribed';
                    buttonEle.classList.add('is-Subcribe');

                }else{buttonEle.innerHTML = 'Subscribe';
                buttonEle.classList.remove('is-Subcribe');
                    
                    
                }
            
        }
        function handlecostKeyDown(event){

            if(event.key === 'Enter'){
                CalculateTotal();
            }

        }

        function CalculateTotal(){
            //console.log(document.querySelector('.js-cost-input'));
            const inputele = document.querySelector('.js-cost-input');
            let cost = Number(inputele.value);

            if(cost < 40){
                cost = (cost +  10);
            }

            document.querySelector('.js-total-cost')
                .innerHTML = `$${cost}`;


        }

        
    </script>
</body>
</html>
